name: Stock Monitor

on:
  workflow_dispatch:
  schedule:
    # 17:30 JST = 08:30 UTC, weekdays
    - cron: "30 8 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-monitor
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore persistent files
        shell: bash
        run: |
          if [ -f results/virtual_trade_log.csv ]; then
            cp results/virtual_trade_log.csv virtual_trade_log.csv
          fi

      - name: Run screener
        run: python stock_screener.py

      - name: Save screener health
        if: always()
        shell: bash
        run: |
          mkdir -p results
          if [ -f screener_health.json ]; then cp screener_health.json results/; fi

      - name: Verify screener output
        shell: bash
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          p = Path("screening_result.csv")
          if not p.exists():
              raise SystemExit("ERROR: screening_result.csv was not created")
          df = pd.read_csv(p, encoding="utf-8-sig")
          if df.empty:
              raise SystemExit("ERROR: screening_result.csv has 0 data rows")
          print(f"screening_result.csv OK: {len(df)} rows")
          PY

      - name: Save screener health
        if: always()
        shell: bash
        run: |
          mkdir -p results
          if [ -f screener_health.json ]; then cp screener_health.json results/; fi

      - name: Run Step2/3 monitor
        run: python step2_3_monitor.py

      - name: Save Step2/3 health
        if: always()
        shell: bash
        run: |
          mkdir -p results
          if [ -f step2_3_health.json ]; then cp step2_3_health.json results/; fi

      - name: Verify Step2/3 output
        shell: bash
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          p = Path("step2_3_result.csv")
          if not p.exists():
              raise SystemExit("ERROR: step2_3_result.csv was not created")
          df = pd.read_csv(p, encoding="utf-8-sig")
          if df.empty:
              raise SystemExit("ERROR: step2_3_result.csv has 0 data rows")
          print(f"step2_3_result.csv OK: {len(df)} rows")
          PY

      - name: Run ranking and virtual trades
        run: python stock_pipeline_enhancer_cloud.py

      - name: Collect core outputs
        shell: bash
        run: |
          mkdir -p results docs
          cp screening_result.csv results/
          cp step2_3_result.csv results/
          cp ranked_candidates.csv results/
          cp virtual_trade_log.csv results/
          cp performance_summary.csv results/
          cp enhancer_diagnostics.txt results/

      - name: Validate scoring evidence
        run: python validate_model.py

      - name: Update persistent Step3 history
        run: python track_step3_history.py

      - name: Calculate market regime
        run: python market_regime.py

      - name: Build iPhone report
        run: python build_mobile_report.py

      - name: Commit persistent results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update stock monitor results"
            git push
          fi

      - name: Upload downloadable results
        uses: actions/upload-artifact@v4
        with:
          name: stock-monitor-results
          path: |
            results/
            docs/index.html
          retention-days: 30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy-pages:
    needs: run-monitor
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy iPhone report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
